services:
  - type: web
    name: verilogs
    runtime: node
    plan: pro
    region: frankfurt
    buildCommand: npm install && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://veri-logs.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: VeriLogs <notifications@veri-logs.com>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
